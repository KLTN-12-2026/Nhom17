name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://localhost:27017/ci_build' }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-build-secret-key-at-least-32-chars-long' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'dummy-key' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy-key' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build
